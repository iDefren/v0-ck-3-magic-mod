 # ============================================================
 # TRAIT LOCALIZATION
 # ============================================================
 
 # Mage Tiers
 arcane_spark: "Arcane Spark"
 arcane_spark_desc: "A faint flicker of magical potential lies dormant within this soul, waiting to be awakened."
 
 mage_initiate: "Mage Initiate"
 mage_initiate_desc: "Having taken the first steps on the path of magic, this individual can feel the flow of mana through the world."
 
 mage_adept: "Mage Adept"
 mage_adept_desc: "A practiced spellcaster capable of wielding considerable magical power."
 
 mage_journeyman: "Mage Journeyman"
 mage_journeyman_desc: "An experienced mage who has mastered the fundamentals and begun exploring advanced magical arts."
 
 mage_expert: "Mage Expert"
 mage_expert_desc: "A formidable wielder of arcane power, respected and feared for their magical prowess."
 
 mage_master: "Mage Master"
 mage_master_desc: "A true master of the arcane arts, capable of feats that lesser mages can only dream of."
 
 archmage: "Archmage"
 archmage_desc: "One of the most powerful magic wielders in existence. Reality itself bends to their will."
 
 mundane_soul: "Mundane Soul"
 mundane_soul_desc: "This individual possesses no magical potential whatsoever. The arcane arts will forever remain beyond their grasp."
 
 # Specializations
 spec_pyromancer: "Pyromancer"
 spec_pyromancer_desc: "A master of fire magic, wielding flames as a weapon of devastating destruction."
 
 spec_cryomancer: "Cryomancer"
 spec_cryomancer_desc: "A wielder of frost magic, capable of freezing enemies and creating barriers of ice."
 
 spec_necromancer: "Necromancer"
 spec_necromancer_desc: "A practitioner of the forbidden arts of death magic, raising the dead and draining life force."
 
 spec_golemancer: "Golemancer"
 spec_golemancer_desc: "A creator of magical constructs, breathing life into stone and metal."
 
 spec_healer: "Divine Healer"
 spec_healer_desc: "A channeler of restorative magic, capable of mending wounds and curing ailments."
 
 spec_diviner: "Diviner"
 spec_diviner_desc: "A seer who peers through the veils of time and space to glimpse hidden truths."
 
 spec_illusionist: "Illusionist"
 spec_illusionist_desc: "A master of deception magic, creating phantasms and bending perception."
 
 spec_storm_caller: "Storm Caller"
 spec_storm_caller_desc: "A commander of the tempest, calling down lightning and howling winds."
 
 spec_blood_mage: "Blood Mage"
 spec_blood_mage_desc: "A practitioner of forbidden blood magic, using life essence as a source of power."
 
 spec_void_walker: "Void Walker"
 spec_void_walker_desc: "One who has touched the emptiness between worlds and returned changed forever."
 
 # Demon Tiers
 demon_low: "Lesser Demon"
 demon_low_desc: "Tainted by infernal corruption, this being has begun their descent into demonic power."
 
 demon_mid: "Greater Demon"
 demon_mid_desc: "A powerful demonic entity with significant supernatural abilities and dark influence."
 
 demon_high: "Demon Lord"
 demon_high_desc: "A fearsome lord of darkness, commanding terrible power and inspiring dread in all who witness them."
 
 demon_legendary: "Demon Prince"
 demon_legendary_desc: "An ancient and terrifying demon of legendary power, rivaling the darkest entities of the abyss."
 
 demon_corruptor: "Corruptor"
 demon_corruptor_desc: "A demon specialized in corrupting souls and spreading darkness."
 
 demon_destroyer: "Destroyer"
 demon_destroyer_desc: "A demon of pure destruction, reveling in chaos and annihilation."
 
 demon_deceiver: "Deceiver"
 demon_deceiver_desc: "A demon who weaves lies and manipulates mortals for their own amusement."
 
 demon_tempter: "Tempter"
 demon_tempter_desc: "A seductive demon who offers power in exchange for one's soul."
 
 # Angel Tiers
 angel_lesser: "Lesser Angel"
 angel_lesser_desc: "Touched by celestial grace, this being radiates an aura of divine light."
 
 angel_greater: "Greater Angel"
 angel_greater_desc: "A powerful celestial being, serving as a conduit for heavenly power."
 
 angel_archangel: "Archangel"
 angel_archangel_desc: "A mighty warrior of heaven, wielding divine authority and formidable power."
 
 celestial_ascended: "Celestial Ascended"
 celestial_ascended_desc: "Having achieved true celestial ascension, this being exists as a living embodiment of divine will."
 
 angel_guardian: "Guardian Angel"
 angel_guardian_desc: "A celestial protector, shielding the innocent from harm."
 
 angel_healer: "Angel of Mercy"
 angel_healer_desc: "A celestial healer, bringing comfort and restoration to the wounded."
 
 angel_prophet: "Prophet"
 angel_prophet_desc: "A celestial messenger, receiving visions and divine guidance."
 
 angel_warlord: "Celestial Warlord"
 angel_warlord_desc: "A commander of heavenly hosts, leading the righteous into battle."
 
 # Other Traits
 magical_scholar: "Magical Scholar"
 magical_scholar_desc: "A dedicated student of arcane lore and magical theory."
 
 ley_line_attuned: "Ley Line Attuned"
 ley_line_attuned_desc: "Deeply connected to the magical currents that flow through the earth."
 
 ritual_master: "Ritual Master"
 ritual_master_desc: "An expert in the performance of complex magical rituals."
 
 arcane_teacher: "Arcane Teacher"
 arcane_teacher_desc: "A patient instructor who guides others along the path of magic."
 
 student_of_magic: "Student of Magic"
 student_of_magic_desc: "Actively learning the ways of magic under the guidance of a mentor."
 
 mana_starved: "Mana Starved"
 mana_starved_desc: "Suffering from severe magical exhaustion, their connection to mana has weakened."
 
 arcane_overload: "Arcane Overload"
 arcane_overload_desc: "Overwhelmed by magical energy, struggling to contain the power within."
 
 cursed_bloodline: "Cursed Bloodline"
 cursed_bloodline_desc: "A dark curse taints this family line, passing misfortune through generations."
 
 soul_tainted: "Soul Tainted"
 soul_tainted_desc: "Their very soul has been corrupted by dark forces, leaving lasting damage."
 
 mage_hunter_initiate: "Mage Hunter Initiate"
 mage_hunter_initiate_desc: "Training in the art of hunting and neutralizing magical threats."
 
 mage_hunter_adept: "Mage Hunter Adept"
 mage_hunter_adept_desc: "An experienced hunter of mages, knowing their tricks and weaknesses."
 
 mage_hunter_master: "Mage Hunter Master"
 mage_hunter_master_desc: "A legendary hunter of magical beings, feared by mages across the realm."
 
 bound_by_contract: "Bound by Contract"
 bound_by_contract_desc: "Their soul is bound by a demonic contract, granting power at a terrible price."
 
 soul_forfeit: "Soul Forfeit"
 soul_forfeit_desc: "Having lost their soul to a demon, they exist as a hollow shell of their former self."
 
 half_demon: "Half-Demon"
 half_demon_desc: "Born of both mortal and demonic parentage, torn between two worlds."
 
 half_angel: "Half-Angel"
 half_angel_desc: "Born of both mortal and celestial blood, blessed with divine heritage."
 
 ageless_mage: "Ageless"
 ageless_mage_desc: "Having conquered death through magic, this being no longer ages."
 
 phylactery_bound: "Phylactery Bound"
 phylactery_bound_desc: "Their soul is bound to a phylactery, granting near-immortality at a terrible cost."
 
 lich_touched: "Lich-Touched"
 lich_touched_desc: "Having dabbled in the darkest necromancy, they bear the mark of undeath."
 
