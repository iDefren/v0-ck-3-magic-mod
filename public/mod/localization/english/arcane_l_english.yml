 # ============================================================
 # EVENT LOCALIZATION
 # ============================================================
 
 # Arcane Events
 arcane.0001.t: "Arcane Awakening"
 arcane.0001.desc: "In the quiet of night, you feel something stir within you. A strange energy pulses through your veins, and the world suddenly seems more... alive. You sense hidden currents of power flowing through all things. Could this be... magic?"
 arcane.0001.a: "Embrace this newfound power"
 arcane.0001.b: "Fight against it and suppress the feeling"
 
 arcane.0010.t: "Adept's Breakthrough"
 arcane.0010.desc: "Your magical abilities have grown significantly. The spells that once required intense concentration now flow naturally, and you can feel greater reserves of power within you. You have become a true mage adept."
 arcane.0010.a: "I feel the power growing within me"
 
 arcane.0011.t: "Choose Your Path"
 arcane.0011.desc: "As your magical abilities mature, you must decide which school of magic calls to you most strongly. Each path offers unique abilities and challenges."
 arcane.0011.a: "The flames of pyromancy speak to me"
 arcane.0011.b: "The cold clarity of cryomancy appeals"
 arcane.0011.c: "I wish to heal and restore"
 arcane.0011.d: "I seek the knowledge of divination"
 arcane.0011.e: "The storms shall be my weapon"
 arcane.0011.f: "I will find my own path in time"
 
 arcane.0020.t: "Master of Magic"
 arcane.0020.desc: "You have achieved mastery over the arcane arts. Few in this world can match your magical prowess. Lesser mages look upon you with awe and respect."
 arcane.0020.a: "My power continues to grow"
 
 arcane.0030.t: "Ascended to Archmage"
 arcane.0030.desc: "You have reached the pinnacle of magical achievement. You are now an Archmage, one of the most powerful wielders of magic in existence. Reality itself bends to your will."
 arcane.0030.a: "I have transcended mortal limits"
 
